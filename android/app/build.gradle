plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'sh.termio.android'
    compileSdk 37

    defaultConfig {
        applicationId 'sh.termio.android'
        minSdk 26
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('TERMIO_ANDROID_VERSION_CODE') ?: '8')
        versionName System.getenv('TERMIO_ANDROID_VERSION') ?: '0.7.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.camera:camera-camera2:1.6.2'
    implementation 'androidx.camera:camera-view:1.6.2'
    implementation 'androidx.camera:camera-mlkit-vision:1.6.2'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation project(':ghostty')
    implementation('io.github.sagernet:libghostty-android-compose:0.1.0-alpha01') {
        exclude group: 'io.github.sagernet', module: 'libghostty-android'
    }
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}
