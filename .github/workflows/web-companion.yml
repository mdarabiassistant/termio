name: Web Companion

on:
  push:
    branches: [main]
    paths: ["web/companion/**", "web/landing/public/logo.png", ".github/workflows/web-companion.yml"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: web-companion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Web companion validation
    runs-on: ubuntu-latest
    # Match @playwright/test; the image includes browsers and system dependencies.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web/companion
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: web/companion/.node-version
          cache: npm
          cache-dependency-path: web/companion/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
