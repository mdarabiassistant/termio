name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, such as v0.55.1"
        required: true
        type: string
      publish:
        description: "Publish a GitHub Release after verifying the DMG"
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_NAME: termio
  DEVELOPER_DIR: /Applications/Xcode_26.4.app/Contents/Developer
  ZIG_VERSION: "0.16.0"
  ZIG_SHA256_AARCH64_MACOS: "b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489"

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Derive version and build number
        id: meta
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "::error::Releases must be built from the current main commit."
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$REQUESTED_TAG"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::Use a release tag such as v0.55.1 or v0.55.1-fork.1."
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            if [[ "$(git rev-parse "$TAG^{commit}")" != "$GITHUB_SHA" ]]; then
              echo "::error::The release tag points at a different commit."
              exit 1
            fi
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::This release already exists; choose a new version."
            exit 1
          fi
          BUILD_NUMBER=$(git rev-list --count HEAD)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG (build $BUILD_NUMBER)"

      - name: Install Zig
        run: |
          url="https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-macos-${ZIG_VERSION}.tar.xz"
          curl -fsSL "$url" -o "$RUNNER_TEMP/zig.tar.xz"
          echo "${ZIG_SHA256_AARCH64_MACOS}  $RUNNER_TEMP/zig.tar.xz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"

      - name: Build ad-hoc-signed universal app
        env:
          SIGN_IDENTITY: "-"
          TERMIO_DISABLE_UPDATES: "1"
          TERMIO_VERSION: ${{ steps.meta.outputs.version }}
          TERMIO_BUILD: ${{ steps.meta.outputs.build }}
        run: ./scripts/build-app.sh

      - name: Create DMG
        run: |
          staging="$RUNNER_TEMP/dmg-staging"
          mkdir -p "$staging"
          ditto "$PWD/${APP_NAME}.app" "$staging/${APP_NAME}.app"
          ln -s /Applications "$staging/Applications"
          DMG_PATH="$RUNNER_TEMP/${APP_NAME}.dmg"
          hdiutil create -volname Termio -srcfolder "$staging" -format UDZO "$DMG_PATH"
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"

      - name: Verify shipped app and backend
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          RELEASE_BUILD: ${{ steps.meta.outputs.build }}
        run: |
          hdiutil verify "$DMG_PATH"
          mount_point="$RUNNER_TEMP/dmg-check"
          mkdir -p "$mount_point"
          hdiutil attach "$DMG_PATH" -mountpoint "$mount_point" -nobrowse -quiet
          trap 'hdiutil detach "$mount_point" -quiet' EXIT
          app="$mount_point/${APP_NAME}.app"
          resources="$app/Contents/Resources"
          plist="$app/Contents/Info.plist"
          codesign --verify --strict --verbose=2 "$app"
          for binary in "$app/Contents/MacOS/termio" "$resources/termiod" "$resources/termio"; do
            codesign --verify --strict "$binary"
            archs="$(lipo -archs "$binary")"
            for arch in arm64 x86_64; do
              if [[ " $archs " != *" $arch "* ]]; then
                echo "::error::$binary is missing its $arch slice."
                exit 1
              fi
            done
          done
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            for name in termiod termio; do
              file "$resources/$name-$target" | grep -q "ELF 64-bit"
            done
          done
          [[ -L "$mount_point/Applications" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" == "$RELEASE_VERSION" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" == "$RELEASE_BUILD" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :SUEnableAutomaticChecks' "$plist")" == "false" ]]
          if /usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$plist" >/dev/null 2>&1; then
            echo "::error::The fork must not use the upstream update feed."
            exit 1
          fi

      - name: Generate checksum
        run: |
          cd "$RUNNER_TEMP"
          shasum -a 256 "${APP_NAME}.dmg" > "${APP_NAME}.dmg.sha256"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: termio-macos-${{ steps.meta.outputs.tag }}
          path: |
            ${{ runner.temp }}/termio.dmg
            ${{ runner.temp }}/termio.dmg.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          Download `termio.dmg`, open it, and drag Termio into Applications.

          This fork build supports Apple silicon and Intel Macs on macOS 14 or later. It is ad-hoc signed and is not notarized by Apple. If macOS blocks the first launch, open System Settings > Privacy & Security and choose Open Anyway.

          Updates are installed manually from this repository's Releases page. The upstream automatic update feed is disabled.

          SSH sessions created from Settings and the host menu now remain on the remote machine across disconnects and app restarts.
          EOF
          flags=()
          [[ "$RELEASE_TAG" == *-* ]] && flags+=(--prerelease)
          [[ "$GITHUB_REF_TYPE" == "tag" ]] && flags+=(--verify-tag)
          gh release create "$RELEASE_TAG" \
            "$DMG_PATH" "$DMG_PATH.sha256" \
            --target "$GITHUB_SHA" \
            --title "Termio $RELEASE_TAG (macOS)" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${flags[@]}"
